# AI-DAW-Conductor · 持续集成
# 在 push / PR 时自动跑单元测试与语法检查
# 注意：完整依赖（playwright/mido/rtmidi）在 CI 上安装较重，测试本身不依赖
# playwright/rtmidi（会降级），只需 fastapi/pydantic/mido/pyyaml/pytest。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 设置 Node（用于前端 JS 语法检查）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 语法检查
        run: |
          python -m py_compile backend/*.py
          node --check frontend/app.js

      - name: 运行单元测试
        run: python -m pytest -v

      - name: 上传测试日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: |
            logs/
            .pytest_cache/
          retention-days: 7
