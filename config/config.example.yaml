# ====================================================================
# AI-DAW-Conductor 配置示例
# 复制为 config.yaml 并按需修改后使用（config.yaml 已被 .gitignore 忽略）
#
# 重要：本项目「不使用 API」，而是复用用户在浏览器里登录的网页端 AI
#      （网页版豆包 / Kimi / 通义千问 / 智谱清言）。无需任何 API Key。
# ====================================================================

server:
  host: "127.0.0.1"
  port: 8787
  cors_origins:
    - "http://localhost:8787"
    - "http://127.0.0.1:8787"

# ---- AI：用户已登录的网页端 AI ----
ai:
  # 选择网页 AI 服务；内置默认入口 URL（见下 web_url）
  provider: "doubao"            # doubao | kimi | qwen | zhipu | custom
  # 网页 AI 的聊天页地址。留空则用 provider 的默认值
  web_url: ""                   # 例：https://www.doubao.com/chat/
  # 单次等待网页 AI 流式回复的超时（秒）
  timeout: 180
  # 网页 AI 的 DOM 选择器（一般无需改；若页面改版导致抓取失败可在此调整）
  selectors:
    input: "textarea, [contenteditable='true']"   # 输入框
    input_type: "auto"                            # auto | textarea | contenteditable
    send: ""                                      # 发送按钮选择器；留空则按回车
    send_via_enter: true
    response: ""                                  # 助手消息容器；留空用 JS 兜底
    generating: ""                                # 「停止生成」按钮选择器；留空用文本稳定性判断

# ---- 浏览器连接 ----
# 推荐用 CDP 模式：用户先用 scripts/launch_chrome.sh 启动一个带调试端口的
# Chrome 并登录网页 AI，后端通过 CDP 复用该会话（不触碰账号密码）。
browser:
  mode: "cdp"                    # cdp（连接已登录的 Chrome，推荐） | persistent（独立用户目录）
  cdp_url: "http://127.0.0.1:9222"
  # persistent 模式专用
  user_data_dir: "~/.ai-daw-conductor/browser-profile"
  headless: false                # persistent 模式下是否无头（建议 false 以便首次登录）

# ---- DAW 控制（Logic Pro）----
daw:
  type: "logic_pro"
  midi_port: "AI-DAW-Conductor"
  use_applescript: true
  app_name: "Logic Pro"
  render_dir: "~/Music/AI-DAW-Conductor/renders"
  default_bpm: 100
  default_time_signature: "4/4"
  default_key: "C"

# ---- 工作流默认参数 ----
workflow:
  pipeline:
    - compose
    - arrange
    - mix
    - master
  max_retries: 2
  open_render_dir: true
